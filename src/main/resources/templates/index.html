<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Record Management</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f6f9;
            color: #2c3e50;
            padding: 24px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #1a3c6e;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,.08);
            padding: 20px;
            margin-bottom: 24px;
        }
        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 14px;
            color: #1a3c6e;
        }
        form.add-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            align-items: end;
        }
        .field { display: flex; flex-direction: column; }
        label { font-size: .85rem; margin-bottom: 4px; font-weight: 600; }
        input, select {
            padding: 8px 10px;
            border: 1px solid #cfd8e3;
            border-radius: 5px;
            font-size: .95rem;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #2f6fed;
            box-shadow: 0 0 0 2px rgba(47,111,237,.2);
        }
        button {
            padding: 9px 18px;
            border: none;
            border-radius: 5px;
            background: #2f6fed;
            color: #fff;
            font-size: .95rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #1f56c4; }
        .search-row {
            display: flex;
            gap: 8px;
        }
        .search-row input { flex: 1; max-width: 320px; }
        .btn-secondary {
            background: #5c6b7f;
        }
        .btn-secondary:hover { background: #46546a; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #e4e9f0;
        }
        th {
            background: #1a3c6e;
            color: #fff;
            font-size: .9rem;
        }
        tr:hover td { background: #f0f5ff; }
        .btn-delete {
            background: #e74c3c;
            padding: 5px 12px;
            font-size: .85rem;
            text-decoration: none;
            color: #fff;
            border-radius: 4px;
        }
        .btn-delete:hover { background: #c0392b; }
        .empty {
            text-align: center;
            color: #7f8c9b;
            padding: 18px !important;
        }
        .actions { display: flex; gap: 8px; }
    </style>
</head>
<body>

<h1>Student Record Management</h1>

<div class="card">
    <h2>Add Student</h2>
    <form class="add-form" th:action="@{/add}" th:object="${student}" method="post">
        <div class="field">
            <label for="studentId">Student ID</label>
            <input type="text" id="studentId" th:field="*{studentId}" placeholder="e.g. S1001" required>
        </div>
        <div class="field">
            <label for="studentName">Student Name</label>
            <input type="text" id="studentName" th:field="*{studentName}" placeholder="Full name" required>
        </div>
        <div class="field">
            <label for="department">Department</label>
            <input type="text" id="department" th:field="*{department}" placeholder="e.g. CSE" required>
        </div>
        <div class="field">
            <label for="semester">Semester (1-12)</label>
            <input type="number" id="semester" th:field="*{semester}" min="1" max="12" required>
        </div>
        <div class="field">
            <label for="cgpa">CGPA (0-10)</label>
            <input type="number" id="cgpa" th:field="*{cgpa}" min="0" max="10" step="0.01" required>
        </div>
        <button type="submit">Add Student</button>
    </form>
</div>

<div class="card">
    <h2>Students</h2>
    <form class="search-row" th:action="@{/}" method="get">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="Filter by department...">
        <button type="submit" class="btn-secondary">Search</button>
        <a th:if="${keyword != null and !keyword.isEmpty()}" th:href="@{/}"
           style="padding:9px 14px; background:#e4e9f0; color:#2c3e50; border-radius:5px; text-decoration:none; font-weight:600;">Clear</a>
    </form>

    <table style="margin-top: 14px;">
        <thead>
        <tr>
            <th>Student ID</th>
            <th>Student Name</th>
            <th>Department</th>
            <th>Semester</th>
            <th>CGPA</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${students}">
            <td th:text="${s.studentId}">S1001</td>
            <td th:text="${s.studentName}">Name</td>
            <td th:text="${s.department}">CSE</td>
            <td th:text="${s.semester}">1</td>
            <td th:text="${s.cgpa}">0.0</td>
            <td>
                <a class="btn-delete"
                   th:href="@{/delete/{id}(id=${s.studentId})}"
                   onclick="return confirm('Delete this student?');">Delete</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(students)}">
            <td class="empty" colspan="6">No student records found.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
